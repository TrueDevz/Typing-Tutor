[package]
name = "indic-typing-tutor"
version = "1.0.0"
description = "InScript Indic Touch Typing Tutor for Indian Languages and English"
authors = ["TrueDevz"]
license = "MIT"
repository = "https://github.com/TrueDevz/Typing-Tutor"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.3" }
tauri-plugin-log = "2"
